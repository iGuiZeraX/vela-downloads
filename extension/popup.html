<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Vela</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;width:370px;background:#0d1117;color:#edf3fa;font:14px 'Segoe UI',sans-serif}h1{font-size:27px;margin:0}p{color:#afbdce;line-height:1.6}label{display:block;font-weight:600;margin-top:20px}input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid #6d8099;border-radius:9px;margin:8px 0;background:#101720;color:#edf3fa}input::placeholder{color:#95a7bd}button{border:0;border-radius:9px;padding:12px 18px;background:#d0f58a;color:#172311;font-weight:600;cursor:pointer}button:hover{background:#e1ffac}button:focus-visible,input:focus-visible{outline:3px solid #d0f58a;outline-offset:3px}#status{min-height:36px;font-size:12px;color:#b8d6f3}small{display:block;color:#afbdce;line-height:1.6;margin-top:10px}.switch{display:flex;gap:10px;align-items:flex-start}.switch input{margin-top:3px;accent-color:#d0f58a}
</style></head><body><h1>Vela <span style="color:#d0f58a">↘</span></h1><p>Os links do navegador.<br>O controle nas suas mãos.</p><label for="token">Código de conexão</label><input id="token" type="password" placeholder="Copie em Vela → Integração Chrome" autocomplete="off"><button id="connect">Salvar conexão</button><label class="switch"><input type="checkbox" id="automatic"><span>Assumir downloads do Chrome</span></label><small>Opcional. O Vela precisa estar aberto. Downloads públicos HTTP/HTTPS; links com login podem precisar continuar no navegador.</small><label for="url">Enviar um link</label><input id="url" type="text" placeholder="https://exemplo.com/arquivo.zip"><button id="send">Baixar com Vela</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
